name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # 當 main 分支有新的 push 時觸發

# 加入以下這段確保機器人有權限寫入內容
permissions:
  contents: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 檢查程式碼
        uses: actions/checkout@v4

      - name: 設定 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: 安裝套件
        run: npm install

      - name: 執行編譯 (Build)
        run: npm run build

      - name: 部署到 GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist # Vite 預設編譯後的資料夾名稱
          branch: gh-pages # 部署到的目標分支
